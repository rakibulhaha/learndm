<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- IMPORTANT: YouTube Error 153 appears when no Referer is sent. Never use "no-referrer" here. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Learn Digital Marketing · Google Ads, Neuro-Marketing &amp; CRO</title>
<meta name="description" content="Distraction-free video lessons: Google Ads Batch-19, Neuro-Marketing and CRO Batch-01.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<script>
try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}
</script>
<style>
:root{--bg:#f7f6fb;--card:#fff;--ink:#23223a;--mute:#6b6a85;--line:#e7e5f2;--shadow:0 10px 30px -12px rgba(60,50,120,.22);--a:#5b6cff;--a2:#9b6bff;--soft:color-mix(in srgb,var(--a) 12%,transparent)}
[data-theme=dark]{--bg:#14131f;--card:#1d1c2d;--ink:#ecebf8;--mute:#9b9ab6;--line:#2c2b42;--shadow:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"DejaVu Serif","Lora",Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:15px;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 300px at 85% -5%,color-mix(in srgb,var(--a2) 22%,transparent),transparent),radial-gradient(500px 300px at 5% 10%,color-mix(in srgb,var(--a) 18%,transparent),transparent)}
button,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{font-weight:600;display:flex;align-items:center;gap:10px;text-decoration:none}
.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;color:#fff;font-size:17px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s,background .2s;font-size:14px}
.pill:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.pill.primary{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:0}
.pill:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.hero{padding:46px 0 26px;max-width:720px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.2;font-weight:600;letter-spacing:-.01em}
.hero p{color:var(--mute);margin:16px 0 22px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 22px}
.tab{--a:var(--c1)}
.tab[aria-selected=true]{background:var(--c1);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.tab small{opacity:.8}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
.player{padding:14px}
.frame{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#000}
.frame iframe,.frame .poster{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{cursor:pointer;background:center/cover #111;display:grid;place-items:center;border:0;padding:0}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.play{z-index:1;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;transition:transform .2s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.poster:hover .play{transform:scale(1.08)}
.play svg{margin-left:4px;fill:var(--a)}
.meta{padding:18px 8px 6px}
.meta h2{font-size:22px;line-height:1.3;font-weight:600}
.meta p{color:var(--mute);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.progress{padding:18px 20px;margin-bottom:16px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .5s}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.list{padding:10px;max-height:560px;overflow:auto}
.list h3{padding:10px 12px 6px;font-size:14px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:18px;cursor:pointer;transition:background .15s}
.item:hover{background:var(--soft)}
.item[aria-current=true]{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--a)}
.dot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--mute)}
.item.done .dot{background:var(--a);border-color:var(--a);color:#fff}
.item span.t{flex:1;font-size:14px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px 0 40px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.list{max-height:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#"><span class="logo">✦</span> Study Hall</a>
    <button class="pill" id="theme" aria-label="Toggle light and dark theme">Switch theme</button>
  </header>

  <section class="hero">
    <h1>Learn at your own pace, without distractions.</h1>
    <p>Three complete video courses in one calm place. Pick a course, press play, and your progress is saved on this device.</p>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>

  <main class="layout">
    <section>
      <div class="card player">
        <div class="frame" id="frame"></div>
        <div class="meta">
          <h2 id="title"></h2>
          <p id="sub"></p>
          <div class="actions">
            <button class="pill" id="prev">Previous</button>
            <button class="pill primary" id="done">Mark as complete</button>
            <button class="pill" id="next">Next</button>
            <a class="pill" id="yt" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
          </div>
        </div>
      </div>
    </section>
    <aside>
      <div class="card progress">
        <div class="row"><strong id="cname" style="color:var(--ink)"></strong><span id="pct"></span></div>
        <div class="bar"><i id="fill"></i></div>
      </div>
      <div class="card list" id="list"></div>
    </aside>
  </main>
  <footer>Videos are hosted on YouTube and play inside this page.</footer>
</div>

<script>
const pad=n=>String(n).padStart(2,"0");
const split=s=>s.trim().split(/\s+/);
const ads=split("pM1Kx91ydCQ FqQqiz_ZO80 bdzwYB0xsp4 u5onaeQ7Vag oeeI2ZjTfF4 I9qT3FJOUCE Z7T0WX_YLHs 6bI3E3VyfFM rdnR6i5LL1U 0jD7PmfYZ0Y n2t3DuS2Igo Z_r_pOMXo0o V2FEnzpH-bM kRohcTdHZjg fU98PHB56ak NYZ7cAmVU1E nwIXzLyiZ4c jiENkR14hps 6suGJsXvfaY VtvaFo7MBCU BGegZhqil9E xv3iPV4YtHw kwh-ZoWuLvI AyC2qsm1JX8 UuROSKyU0DQ Oo1oMQpf6Z4 Q2Jy1fAr9uI XSesWfTPq-Q 1Olzv44ixxQ ZnZiKn_E5lk fFRrHen6Olk");
const neuro=split("YRz_-rUmQAs PuV4GPYus6U OpXWAqiradg 8Y5eXEunuFk w3Egks-ztaI Q3v3S5n4Un8");
const cro=split("VVqXlfXNqcg 1m2YEK6kn9w 7l1vXGYlzbE BHg8aZjHX0w bopBF2YPpqI GpeugO8jMr0 QJuTzZx07DA K_OqYrhUD0g IVRGdlCB6j8 VuZ-o5QusoE nr8Jp61jYk0");
const adsLabel=i=>i<12?"Class "+pad(i+1):i===12?"Class 13 · Part 1":i===13?"Class 13 · Part 2":"Class "+pad(i);
const courses=[
 {k:"ads",name:"Google Ads · Batch-19",c1:"#4f6bff",c2:"#8f6bff",ids:ads,label:adsLabel},
 {k:"neuro",name:"Neuro-Marketing",c1:"#e0509b",c2:"#ff8a5c",ids:neuro,label:i=>"Lesson "+pad(i+1)},
 {k:"cro",name:"CRO · Batch-01",c1:"#12a37f",c2:"#3bbcd6",ids:cro,label:i=>"Class "+pad(i+1)}
];
const $=id=>document.getElementById(id);
let cur=0,idx=0,state={};
try{state=JSON.parse(localStorage.getItem("progress")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("progress",JSON.stringify(state))}catch(e){}};
const doneSet=c=>state[courses[c].k]||(state[courses[c].k]=[]);

function paint(){
  const c=courses[cur],r=document.documentElement.style;
  r.setProperty("--a",c.c1);r.setProperty("--a2",c.c2);
  $("tabs").innerHTML=courses.map((x,i)=>{const d=doneSet(i).length;
    return `<button class="pill tab" role="tab" style="--c1:${x.c1}" aria-selected="${i===cur}" data-c="${i}">${x.name} <small>${d}/${x.ids.length}</small></button>`}).join("");
  const d=doneSet(cur);
  $("list").innerHTML=`<h3>${c.name}</h3>`+c.ids.map((id,i)=>`<button class="item ${d.includes(i)?"done":""}" data-i="${i}" ${i===idx?'aria-current="true"':""}><span class="dot">${d.includes(i)?"✓":i+1}</span><span class="t">${c.label(i)}</span></button>`).join("");
  const p=Math.round(d.length/c.ids.length*100);
  $("cname").textContent=c.name;$("pct").textContent=p+"% complete";$("fill").style.width=p+"%";
  $("title").textContent=c.label(idx);
  $("sub").textContent=c.name+" · "+(idx+1)+" of "+c.ids.length;
  $("prev").disabled=idx===0;$("next").disabled=idx===c.ids.length-1;
  $("done").textContent=d.includes(idx)?"Completed ✓":"Mark as complete";
  $("yt").href="https://www.youtube.com/watch?v="+c.ids[idx];
  const id=c.ids[idx];
  $("frame").innerHTML=`<button class="poster" aria-label="Play ${c.label(idx)}" style="background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)"><span class="play"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>`;
  $("frame").firstChild.onclick=()=>embed(id);
  try{history.replaceState(null,"","#"+c.k+"-"+(idx+1))}catch(e){}
}
function embed(id){
  // Referrer policy + origin param are what prevent "Error 153" on https hosting.
  const q=new URLSearchParams({autoplay:1,rel:0,modestbranding:1,playsinline:1});
  if(location.protocol.startsWith("http"))q.set("origin",location.origin);
  const f=document.createElement("iframe");
  f.src="https://www.youtube-nocookie.com/embed/"+id+"?"+q;
  f.title=$("title").textContent;
  f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
  f.referrerPolicy="strict-origin-when-cross-origin";
  f.allowFullscreen=true;
  $("frame").replaceChildren(f);
}
const go=(c,i)=>{cur=c;idx=i;paint();};
$("tabs").onclick=e=>{const b=e.target.closest("[data-c]");if(b)go(+b.dataset.c,0)};
$("list").onclick=e=>{const b=e.target.closest("[data-i]");if(b){go(cur,+b.dataset.i);$("frame").scrollIntoView({block:"center",behavior:"smooth"})}};
$("prev").onclick=()=>go(cur,idx-1);
$("next").onclick=()=>go(cur,idx+1);
$("done").onclick=()=>{const d=doneSet(cur),p=d.indexOf(idx);p<0?d.push(idx):d.splice(p,1);save();
  const wasDone=p<0;paint();if(wasDone&&idx<courses[cur].ids.length-1)$("next").focus()};
$("theme").onclick=()=>{const dark=document.documentElement.dataset.theme!=="dark";
  document.documentElement.dataset.theme=dark?"dark":"light";try{localStorage.setItem("theme",dark?"dark":"light")}catch(e){}};
const m=location.hash.match(/^#(ads|neuro|cro)-(\d+)$/);
if(m){cur=courses.findIndex(c=>c.k===m[1]);idx=Math.min(Math.max(+m[2]-1,0),courses[cur].ids.length-1)}
paint();
</script>
</body>
</html>
